---
on: issue_comment

jobs:
  build:
    name: Build container on comment
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/containerbuild') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo A comment on PR $NUMBER
        env:
          NUMBER: ${{ github.event.issue.number }}
